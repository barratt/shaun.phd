name: Deploy Frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select package manager
        run: npm install --global npm@12.2.3 --ignore-scripts
      - name: Install frozen dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Audit dependencies
        run: npm audit --package-lock-only
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site-build
          path: dist
      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: dist
          wranglerVersion: '4.166.0'
          command: pages deploy . --project-name=shaun-phd --branch=main --commit-hash=${{ github.sha }}
